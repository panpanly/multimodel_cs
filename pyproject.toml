[project]
name = "multimodel-cs"
version = "0.1.0"
description = "多模态智能客服系统"
readme = "README.md"
authors = [
    { name = 'LAPTOP-S7JRK4OE\Ming', email = "962886827@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4.0",
    "edge-tts>=6.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "gradio>=4.0.0",
    "langchain-openai>=1.5.1",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=9.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "sentence-transformers>=2.2.0",
    "soundfile>=0.12.0",
    "ultralytics>=8.0.0",
    "uvicorn[standard]>=0.22.0",
]

[project.scripts]
multimodel-cs = "multimodel_cs:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
